<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="那覇のバス停から、首里城・北谷アメリカンビレッジ・美ら海水族館・万座毛・那覇空港への乗り方。Bus guide from Naha in Japanese, English, Chinese and Korean.">
<meta name="theme-color" content="#0b4f8a">
<title>Okinawa Bus Guide</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://okinawa-bus-guide.github.io/">
<meta property="og:title" content="Okinawa Bus Guide｜那覇から バスの乗り方">
<meta property="og:description" content="那覇のバス停から、首里城・アメリカンビレッジ・美ら海水族館・万座毛・ライカム・那覇空港へ。次のバス・乗る場所・降りる場所を5つの言語で。">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#132130; --muted:#5b6876; --line:#d6dde5;
  --accent:#0b4f8a; --accent-soft:#e3edf7;
  --rail:#0f7a5c; --rail-soft:#e0f2ec;
  --warn:#3f5d68; --warn-soft:#e7eef0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1620; --surface:#16212d; --ink:#e4ebf2; --muted:#9aa8b6; --line:#2a3846;
    --accent:#7db6ec; --accent-soft:#1a2d42;
    --rail:#6fd0ae; --rail-soft:#173329;
    --warn:#b9cbd1; --warn-soft:#223239;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1620; --surface:#16212d; --ink:#e4ebf2; --muted:#9aa8b6; --line:#2a3846;
  --accent:#7db6ec; --accent-soft:#1a2d42;
  --rail:#6fd0ae; --rail-soft:#173329;
  --warn:#b9cbd1; --warn-soft:#223239;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","PingFang TC","PingFang SC","Apple SD Gothic Neo","Noto Sans CJK JP",sans-serif;font-size:16px;line-height:1.6}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.langs{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.langs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.langs button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 2px;font-size:.82rem;line-height:1.2;white-space:nowrap}
.langs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}

.wrap{max-width:560px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:1.3rem;line-height:1.3}
.about{margin:-10px 0 0;font-size:.82rem;color:var(--muted)}
.title{color:inherit;text-decoration:none}
.home{align-self:flex-start;font-size:.8rem;font-weight:700;color:var(--muted);text-decoration:none;margin-bottom:-8px}
.share{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:16px}
.share div{display:flex;gap:12px}
.share a,.share button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;text-decoration:none;padding:0}
.share svg{width:20px;height:20px;fill:currentColor}
.share div{flex-wrap:wrap;justify-content:center}
.sns-line{color:#06c755 !important}.sns-whatsapp{color:#25d366 !important}.sns-facebook{color:#0866ff !important}.sns-wechat{color:#07c160 !important}.sns-sinaweibo{color:#e6162d !important}.sns-kakaotalk{color:#3c1e1e !important;background:#fee500 !important;border-color:#fee500 !important}
.copied{margin:0;font-size:.85rem;color:var(--accent)}
.foot{margin-top:12px;text-align:center;font-size:.8rem;color:var(--muted)}
.foot a{color:var(--muted)}
.label{font-size:.8rem;color:var(--muted);margin:0 0 6px}

.stops{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stops button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 8px;text-align:left;line-height:1.3;font-size:.9rem}
.stops button[aria-pressed="true"]{border:2px solid var(--accent);padding:9px 7px;font-weight:700;background:var(--accent-soft)}

.dests{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dests button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 10px 16px 12px;text-align:left;font-size:min(1.05rem,4.2vw);word-break:keep-all;overflow-wrap:anywhere;font-weight:700;line-height:1.3;min-height:72px}
.dests button small{display:block;font-weight:400;font-size:.78rem;color:var(--muted);margin-top:2px}
.dests .other{grid-column:1 / -1;margin:4px 0 0;text-align:center;font-size:.9rem;color:var(--muted)}
.dests .other a{color:var(--accent)}

/* 案内の画面 */
.back{align-self:flex-start;border:0;background:transparent;color:var(--accent);padding:4px 0;font-size:.95rem}
.route-head{display:flex;flex-direction:column;gap:2px}
.route-head .from{color:var(--muted);font-size:.9rem}
.route-head h1{font-size:1.6rem}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 16px;font-weight:700;font-size:.95rem;line-height:1.6}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 6px;font-size:.92rem}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:700}
.big{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.big .row{padding:14px 16px;border-top:1px solid var(--line)}
.big .row:first-child{border-top:0}
.big .k{font-size:.8rem;color:var(--muted)}
.big .v{font-size:1.45rem;font-weight:700;line-height:1.35}
.big .v .num{font-size:1.9rem}
.big .s{font-size:.95rem;margin-top:2px}
.badge{display:inline-block;min-width:2.2em;text-align:center;border-radius:10px;background:var(--accent);color:var(--surface);padding:0 8px;margin-right:6px}
.badge.rail{background:var(--rail)}
.steps{margin:0;padding:0 0 0 1.4em;display:flex;flex-direction:column;gap:6px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.facts dt{color:var(--muted);font-size:.85rem;padding-top:2px}
.facts dd{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{margin:0 0 8px;font-size:1rem}
.maps{display:block;text-align:center;color:var(--accent);padding:6px;font-size:.92rem}
.qr{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.qr svg{width:220px;height:220px;background:#fff;padding:10px;border-radius:12px}
.qr p{margin:0;font-size:.95rem}
.note{font-size:.8rem;color:var(--muted)}
.next h2{margin:0 0 6px;font-size:.85rem;color:var(--muted);font-weight:400}
.next ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.next li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.next li:first-child .t{font-size:2.2rem}
.next .t{font-size:1.5rem;font-weight:600;min-width:3.2em}
.next .badge{font-size:1.2rem}
.next .in{font-weight:700;color:var(--accent)}
.next .at{flex-basis:100%;font-size:.85rem;color:var(--muted)}
.next .in.late{color:var(--warn);font-size:.85rem}
.next .delay{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:.85rem;color:var(--warn)}
.next .none{margin:0;font-weight:700}
.next .tmr{margin:6px 0 0;font-size:1.05rem}
.rail h2{color:var(--rail)}
.rail .facts{margin:0}
.alight + .alight{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.howfor{margin:10px 0 4px}
.steps li{line-height:1.5}
.nw{display:inline-block}
.src{margin:0;text-align:center;font-size:.75rem;color:var(--muted)}
.pending{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted)}
[hidden]{display:none !important}
</style>
</head>
<body>
<nav class="langs" aria-label="Language"><div id="langs"></div></nav>
<main class="wrap" id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// GitHub Pages は10分キャッシュするので、データと画面のスクリプトは開くたびに最新を読む
['times.js', 'data.js', 'app.js'].forEach(function (f) {
  var s = document.createElement('script'); s.src = f + '?t=' + Date.now(); s.async = false; document.body.appendChild(s);
});
</script>
</body>
</html>
